# 再利用可能ワークフロー rust-gates.yml 自体の回帰テスト。
# fixtures/hello で固定ゲート・apt・wasm・env_vars・audit を、
# fixtures/clippy-args で clippy_args を検証する。
name: self-test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/rust-gates.yml
    with:
      apt_packages: file
      wasm_targets: wasm32-unknown-unknown
      working_directory: fixtures/hello
      env_vars: |
        SELFTEST_ENV=ok
      extra_gates: |
        test "$SELFTEST_ENV" = "ok"
        cargo check --target wasm32-unknown-unknown --locked

  gates-clippy-args:
    uses: ./.github/workflows/rust-gates.yml
    with:
      working_directory: fixtures/clippy-args
      clippy_args: "-A clippy::needless_return"

  gates-audit:
    uses: ./.github/workflows/rust-gates.yml
    with:
      working_directory: fixtures/hello
      audit: true
