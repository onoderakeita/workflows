# 再利用可能ワークフロー rust-gates.yml 自体の回帰テスト。
# fixtures/hello（依存なしの最小クレート）に対して全ゲートを実行する。
name: self-test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/rust-gates.yml
    with:
      apt_packages: file
      wasm_targets: wasm32-unknown-unknown
      working_directory: fixtures/hello
      extra_gates: |
        cargo check --target wasm32-unknown-unknown --locked
